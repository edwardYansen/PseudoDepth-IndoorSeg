[workspace]
authors = ["EdwardYansen <edward.yansen@binus.ac.id>"]
channels = ["conda-forge", "nvidia"] 
name = "IndoorSegmentation"
platforms = ["linux-64"]
preview = ["pixi-build"]
version = "0.1.0"

[system-requirements]
cuda = "12.9"

[tasks]

[dependencies]
python = "3.12.*"
jupyterlab = ">=4.5.1,<5"
opencv = ">=4.13.0,<5"
numpy = ">=2.4.1,<3"
pytorch-gpu = "*"
cuda-version = "12.9.*"
cuda-toolkit = ">=12.9.2,<13"
torchvision = ">=0.26.0,<0.27"
torchmetrics = ">=1.9.0,<2"
torchaudio = ">=2.11.0,<3"
h5py = ">=3.16.0,<4"
matplotlib = ">=3.10.9,<4"
transformers = ">=5.9.0,<6"
diffusers = ">=0.37.1,<0.38"
scipy = ">=1.17.1,<2"
segmentation-models-pytorch = ">=0.5.0,<0.6"
ninja = ">=1.13.2,<2"
easydict = ">=1.13,<2"
pbkdf2 = ">=1.3,<2"
protobuf = ">=6.33.5,<7"
tensorboardx = ">=2.6.2.2,<3"
tqdm = ">=4.67.3,<5"
accelerate = ">=1.13.0,<2"
fvcore = ">=0.1.5.post20221221,<0.2"
iopath = ">=0.1.10,<0.2"

[pypi-options]
find-links = [{url = 'https://download.pytorch.org/whl/cu129'}]
extra-index-urls = ["https://download.pytorch.org/whl/cu129"]


